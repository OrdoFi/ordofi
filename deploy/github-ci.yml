# To activate: move this file to .github/workflows/ci.yml (requires a GitHub
# token with the `workflow` scope, or upload it via the GitHub web UI).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    name: TypeScript services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # packages/store uses node:sqlite, which needs 24+ (22 hides it
          # behind --experimental-sqlite) — same constraint as the Dockerfile.
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  contracts:
    name: Solidity contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Vendor forge-std
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - name: Forge tests
        working-directory: contracts
        run: forge test -vv
