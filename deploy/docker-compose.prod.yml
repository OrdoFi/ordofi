# Production stack: OrdoFi services behind Caddy (auto-TLS), pointed at our own
# Nitro node. Run the node separately (deploy/nitro-node) — ideally same VPC.
#
#   ORDO_RPC_URL=http://nitro:8547 docker compose -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, gateway, auction]

  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: gateway
      ORDO_PORT: 8547
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_API_KEYS: ${ORDO_API_KEYS:-}
      ORDO_ALLOW_ANON: ${ORDO_ALLOW_ANON:-1}
    restart: unless-stopped

  auction:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: auction
      ORDO_AUCTION_PORT: 8548
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_SETTLEMENT_ADDRESS: ${ORDO_SETTLEMENT_ADDRESS:-}
      ORDO_AUCTION_WINDOW_MS: ${ORDO_AUCTION_WINDOW_MS:-200}
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: web
      ORDO_WEB_PORT: 3000
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_SETTLEMENT_ADDRESS: ${ORDO_SETTLEMENT_ADDRESS:-}
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  watcher:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: watcher
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_ETH_USD: ${ORDO_ETH_USD:-2250}
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

volumes:
  ordo-data:
  caddy-data:
  caddy-config:
