# Production stack: OrdoFi services behind Caddy (auto-TLS), pointed at our own
# Nitro node. Run the node separately (deploy/nitro-node) — ideally same VPC.
#
# Run from the repo root, and pass the root .env explicitly: compose otherwise
# looks for .env next to this file and would start every service unconfigured.
#
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d
#
# .env must carry the addresses written by contracts/deploy.sh
# (ORDO_SETTLEMENT_ADDRESS, ORDO_BUNDLER_ADDRESS), the auctioneer hot key, and
# the API keys. Set ORDO_RPC_URL=http://nitro:8547 once the node is up.
x-gateway: &gateway
  build: { context: .., dockerfile: deploy/Dockerfile }
  # One image for both replicas; rollout.sh builds it once and compares the
  # running containers against it.
  image: ordofi-gateway
  # node directly, not through `npm run` and `sh -c`: SIGTERM has to reach the
  # process that owns the listener for the drain to happen, and the grace
  # period must outlast a slow protected send.
  command: ["node", "--import", "tsx", "apps/gateway/src/main.ts"]
  init: true
  stop_grace_period: 20s
  # The box is two shared vCPUs. This is a weight, not a cap: under
  # contention the gateway gets first call on a core over the indexer and
  # the bots, whose latency nobody is waiting on. When idle, everything runs.
  cpu_shares: 2048
  environment:
    SERVICE: gateway
    ORDO_PORT: 8547
    ORDO_CHAIN_ID: 4663
    ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
    # Light traffic rides the authenticated quota-limited upstream first
    # (ORDO_RPC_URLS_LIGHT); the watcher's bulk volume stays on the public
    # list so it cannot burn through that quota.
    ORDO_RPC_URLS: ${ORDO_RPC_URLS_LIGHT:-${ORDO_RPC_URLS:-}}
    ORDO_API_KEYS: ${ORDO_API_KEYS:-}
    ORDO_ALLOW_ANON: ${ORDO_ALLOW_ANON:-1}
    # Without this the gateway looks for the auction on its own localhost,
    # fails, and silently falls back to unauctioned direct sends — protection
    # without rebates. It is the difference between earning and not.
    ORDO_AUCTION_URL: http://auction:8548
    ORDO_BUNDLER_ADDRESS: ${ORDO_BUNDLER_ADDRESS:-}
  # Shared index: the portal writes hashed API keys, the gateway reads them.
  volumes: ["ordo-data:/app/data"]
  depends_on: [auction]
  restart: unless-stopped

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # 443/udp is HTTP/3. Caddy serves it by default; it just needs the port.
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, gateway-a, gateway-b, auction]

  # The gateway is two replicas, gateway-a and gateway-b, so a deploy is a
  # rolling restart (deploy/rollout.sh) and a crash leaves one answering. They
  # are two named services rather than one scaled service because Caddy only
  # runs active health checks against static upstreams: a draining replica
  # answers /health with 503 and is pulled out of rotation before its listener
  # closes, which is what makes the rollout invisible. Both also answer to the
  # alias `gateway`. No host port is published, which is what makes two of
  # them possible.
  gateway-a:
    <<: *gateway
    networks: { default: { aliases: [gateway] } }
  gateway-b:
    <<: *gateway
    networks: { default: { aliases: [gateway] } }

  auction:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: auction
      ORDO_AUCTION_PORT: 8548
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_RPC_URLS: ${ORDO_RPC_URLS_LIGHT:-${ORDO_RPC_URLS:-}}
      ORDO_SETTLEMENT_ADDRESS: ${ORDO_SETTLEMENT_ADDRESS:-}
      # Hot key for the auctioneer address the settlement contract authorizes.
      # Without it the auction still runs and still writes settlement records,
      # but nothing is ever collected on-chain.
      ORDO_AUCTIONEER_KEY: ${ORDO_AUCTIONEER_KEY:-}
      ORDO_RECEIPT_LOG_ADDRESS: ${ORDO_RECEIPT_LOG_ADDRESS:-}
      ORDO_AUCTION_WINDOW_MS: ${ORDO_AUCTION_WINDOW_MS:-200}
      ORDO_REBATE_USER: ${ORDO_REBATE_USER:-0.9}
      ORDO_REBATE_APP: ${ORDO_REBATE_APP:-0.05}
      ORDO_REBATE_PROTOCOL: ${ORDO_REBATE_PROTOCOL:-0.05}
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    # Started directly (not through npm) so the inspector belongs to the server
    # process: `docker exec deploy-web-1 node /tmp/prof.mjs 15` profiles it live.
    # 9229 is bound inside the container only.
    working_dir: /app/apps/web
    command: ["node", "--inspect=127.0.0.1:9229", "serve.mjs"]
    environment:
      SERVICE: web
      ORDO_WEB_PORT: 3000
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_RPC_URLS: ${ORDO_RPC_URLS_LIGHT:-${ORDO_RPC_URLS:-}}
      ORDO_SETTLEMENT_ADDRESS: ${ORDO_SETTLEMENT_ADDRESS:-}
      # Same reason as the gateway: the explorer's auction panel goes blank
      # without it.
      ORDO_AUCTION_URL: http://auction:8548
      ORDO_ARB_URL: http://arb:8549
      ORDO_STEALTH_SEND_ADDRESS: ${ORDO_STEALTH_SEND_ADDRESS:-}
      ORDO_LADDER_ADDRESS: ${ORDO_LADDER_ADDRESS:-}
      ORDO_LADDER_BLOCK: ${ORDO_LADDER_BLOCK:-}
      ORDO_STAKE_FACTORY: ${ORDO_STAKE_FACTORY:-}
      ORDO_STAKE_ZAP: ${ORDO_STAKE_ZAP:-}
      # V4 twins default to the addresses in @ordofi/core; set these only to point at a redeploy.
      ORDO_LADDER_V4_ADDRESS: ${ORDO_LADDER_V4_ADDRESS:-}
      ORDO_LADDER_V4_BLOCK: ${ORDO_LADDER_V4_BLOCK:-}
      ORDO_STAKE_FACTORY_V4: ${ORDO_STAKE_FACTORY_V4:-}
      ORDO_STAKE_ZAP_V4: ${ORDO_STAKE_ZAP_V4:-}
      ORDO_ARCHIVE_RPC: ${ORDO_ARCHIVE_RPC:-}
    depends_on: [auction]
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  # The house searcher: keeps the auction non-empty so the first app to route
  # flow meets a live market. Loses money on gas by design (its backrun is a
  # placeholder); its job is market liveness, not profit.
  searcher:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: searcher-bot
      ORDO_AUCTION_WS: ws://auction:8548/searcher
      ORDO_SETTLEMENT_ADDRESS: ${ORDO_SETTLEMENT_ADDRESS:-}
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_RPC_URLS: ${ORDO_RPC_URLS_LIGHT:-${ORDO_RPC_URLS:-}}
      SEARCHER_KEY: ${ORDO_HOUSE_SEARCHER_KEY:-}
      ORDO_MAX_BID_ETH: ${ORDO_HOUSE_MAX_BID_ETH:-0.0001}
    depends_on: [auction]
    restart: unless-stopped

  # The house arbitrage bot: trades its own capital on cross-fee-tier cycles,
  # simulating every candidate for free and only sending when the edge clears
  # gas plus a margin. Its own wallet (ORDO_ARB_KEY), so nonces never collide
  # with the bidding bot above. No key => it logs and exits, harmless.
  arb:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERVICE: arb-bot
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_RPC_URLS: ${ORDO_RPC_URLS_LIGHT:-${ORDO_RPC_URLS:-}}
      ORDO_ARB_KEY: ${ORDO_ARB_KEY:-}
      ORDO_ARB_MIN_PROFIT_ETH: ${ORDO_ARB_MIN_PROFIT_ETH:-0.000004}
      ORDO_ARB_GAS_RESERVE_ETH: ${ORDO_ARB_GAS_RESERVE_ETH:-0.0008}
      ORDO_ARB_MAX_NOTIONAL_ETH: ${ORDO_ARB_MAX_NOTIONAL_ETH:-}
      ORDO_ARB_DAILY_GAS_CAP_ETH: ${ORDO_ARB_DAILY_GAS_CAP_ETH:-0.01}
      # Read-only status the web app publishes at /desk; the fill ledger goes
      # on the shared volume so totals survive restarts.
      ORDO_ARB_PORT: 8549
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  watcher:
    build: { context: .., dockerfile: deploy/Dockerfile }
    # The heaviest process on the box and the one nobody is waiting on:
    # it yields to the gateway (2048) and the rest (1024) under contention.
    cpu_shares: 512
    environment:
      SERVICE: watcher
      ORDO_RPC_URL: ${ORDO_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_RPC_URLS: ${ORDO_RPC_URLS:-}
      # Unset means read the live rate from the WETH/USDG pool; set it to pin.
      ORDO_ETH_USD: ${ORDO_ETH_USD:-}
      # Only consulted when there is no checkpoint. An hour of chain is about
      # 36,000 blocks, which the indexer now covers in roughly twelve minutes.
      ORDO_BACKFILL: ${ORDO_BACKFILL:-0}
      ORDO_CONCURRENCY: ${ORDO_CONCURRENCY:-8}
      ORDO_MAX_BATCH: ${ORDO_MAX_BATCH:-400}
      ORDO_LOG_ARBS: ${ORDO_LOG_ARBS:-}
    volumes: ["ordo-data:/app/data"]
    restart: unless-stopped

  # Chart history. Walks every active pool's Swap events back to genesis into
  # the same candle table the watcher writes, checkpointed per pool. Not part
  # of the default stack:
  #
  #   docker compose --env-file .env -f deploy/docker-compose.prod.yml --profile backfill up -d backfill
  #
  # Point ORDO_ARCHIVE_RPC at our own node once it is synced and it simply
  # continues from where the throttled public endpoint left off.
  backfill:
    build: { context: .., dockerfile: deploy/Dockerfile }
    profiles: ["backfill"]
    command: ["node", "--max-old-space-size=768", "scripts/backfill-candles.mjs", "--all", "--pools", "${ORDO_BACKFILL_POOLS:-120}", "--pace", "${ORDO_BACKFILL_PACE_MS:-0}", "--parallel", "${ORDO_BACKFILL_PARALLEL:-5}", "--max-logs", "${ORDO_BACKFILL_MAX_LOGS:-12000}"]
    # The app server has 3 GB and also runs the indexer; keep the backfill from
    # crowding it out even when a window comes back unexpectedly large.
    mem_limit: 1g
    cpu_shares: 256
    environment:
      ORDO_ARCHIVE_RPC: ${ORDO_ARCHIVE_RPC:-https://rpc.mainnet.chain.robinhood.com}
      ORDO_DB: /app/data/ordo.db
    volumes: ["ordo-data:/app/data"]
    restart: on-failure

volumes:
  ordo-data:
  caddy-data:
  caddy-config:
