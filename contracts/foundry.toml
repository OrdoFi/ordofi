[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "@uniswap/v4-core/src/libraries/=src/vendor/v4/"]

# Robinhood Chain
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
